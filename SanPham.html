<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hh-box{
            border-radius: 5px; box-shadow: 0 0 5px silver;
            position:relative; display:inline-block;
            margin: 25px 5px 5px 5px;
            padding: 15px 0px;
            text-align:center;
            width: 200px;
        }
        .hh-box:hover{
            box-shadow: 0 0 5px red;
        }
        .hh-box-img{
            width: 130px;
            height: 130px;
        }
        .hh-box-icon{
            position:absolute;
            top:0px;
            right:0px;
        }
        .hh-box-name{
            position:absolute;
            left: 0px;top:-20px;
            width: inherit;
            text-align: center;
        }
        .hh-box-price{
            position: absolute;
            left: 8px;
            bottom: 8px;
            font-weight: bold;
            color: silver;
        }
        .hh-box-actions{
            position:absolute;
            right: 8px;
            bottom: 5px;
            width: 25px;
        }
        .hh-box-action, img{
            cursor:pointer;
            border: 0px;
        }
    </style>
</head>
<body>
    <div class="hh-box">
        <div class="hh-box-name">Nikon D3100</div>
        <img class="hh-box-img" src="https://bizweb.dktcdn.net/thumb/grande/100/297/199/products/3497-3497-4488.jpg?v=1529741791653" />
        <div class="hh-box-price"$99.99></div>
        <div class="hh-box-actions">
            <a href=""><img src=""></a>
        </div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt1WMowoom2oWN-xCkOvcoLQWl_fDh-1SBznpIgcdF2A&s=10" class="hh-box-icon" width="60"/>
    </div>
</body>
</html>
