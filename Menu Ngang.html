<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
            color: #F00;
            font-family:Arial;
        }
        .menu{
            width: 1200px;height: 50px;margin: auto;background-color: #ccc;
        }
        .menu, ul{
            padding: 0;
            margin:0;
            list-style: none;
        }
        .menu, ul, li{
            float: left;
        }
        .menu, ul, li, a{
            text-decoration: none;
            padding: 0 20px;
            color:#000;
            font-family: Arial;
            font-size: 14px;
            line-height: 50px;
            display: block;
        }
        .menu, ul, li, a:hover{
            background-color: #333;
            line-height: 48px;
            color: #fff;
            border-bottom: 2px solid #F00;
        }
    </style>
</head>
<body>
    <h1>MINH HỌA MENU NGANG - MỘT CẤP</h1>
    <DIV CLASS="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dự án</a></li>
            <li><a href="#">Sản phẩm</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </DIV>
</body>
</html>
