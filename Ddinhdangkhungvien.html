<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .outside{
        border-style: dotted; 
        border-radius: 10px;
        padding: 20px;
        border-color: blue;
    }
    .middle{
        border-style: dashed; 
        border-radius: 10px;
        padding: 20px;
        border-color: red;
    }
    .inner{
        border-style: solid; 
        border-radius: 10px;
        padding: 20px;
        border-color:green;
        text-align: center;
        font-size: larger;
    }
    </style>
</head>
<body>
    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heaviy packed<br>
                &lt DIV &gt
            </div>
        </div>
    </div>
</body>
</html>
